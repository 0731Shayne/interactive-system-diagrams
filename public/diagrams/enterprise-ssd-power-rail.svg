<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise SSD power rail</title>
  <desc id="desc">Enterprise SSD power architecture for NAND, controller, PCIe PHY and DDR rails.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#232323"/></marker>
    <style>
      text{font-family:Arial,"PingFang SC",sans-serif;fill:#202020}.label{font-size:12px}.block{font-size:12px;fill:#fff;text-anchor:middle}.strong{font-weight:700}.note{font-size:11px}.logo{fill:#cc241e}.green{fill:#71b044}.coral{fill:#ef7773}.amber{fill:#ffbd16}.gray{fill:#aaa}.wire{stroke:#333;stroke-width:1.15;fill:none}.soft{stroke:#efc9c7}.module{rx:7;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="52" y="48" width="47" height="4" fill="#c90000"/>
  <text x="905" y="35" text-anchor="end" font-size="18" font-weight="700" class="logo">SOUTHCHIP</text>
  <text x="905" y="51" text-anchor="end" font-size="9" letter-spacing="4">南 芯 科 技</text>

  <text x="71" y="105" class="label">12V</text>
  <path d="M92 111H221M323 111H398" class="wire" marker-end="url(#arrow)"/>
  <rect x="221" y="91" width="102" height="40" class="module amber"/>
  <text x="272" y="115" class="block strong">PLP + eFuse</text>
  <rect x="221" y="151" width="102" height="38" class="module gray"/>
  <text x="272" y="174" class="block strong">PLP Cap</text>
  <path d="M272 131V151" class="wire soft"/>

  <path d="M398 111V454" class="wire"/>
  <path d="M398 111H421M398 160H421M398 209H421M398 258H421M398 307H421M398 356H421M398 405H421M398 454H421" class="wire"/>
  <rect x="421" y="89" width="148" height="42" class="module coral"/>
  <text x="495" y="108" class="block">NAND VDD</text><text x="495" y="123" class="block strong">SC812A2</text>
  <rect x="421" y="138" width="148" height="42" class="module green"/>
  <text x="495" y="157" class="block">NAND VPP</text><text x="495" y="172" class="block strong">SC8723</text>
  <rect x="421" y="187" width="148" height="42" class="module green"/>
  <text x="495" y="206" class="block">NAND VCCQ</text><text x="495" y="221" class="block strong">SC81360</text>
  <rect x="421" y="236" width="148" height="42" class="module coral"/>
  <text x="495" y="255" class="block">Core power</text><text x="495" y="270" class="block strong">SC812B0</text>
  <rect x="421" y="285" width="148" height="42" class="module green"/>
  <text x="495" y="304" class="block">PCIe VDDH</text><text x="495" y="319" class="block strong">SC81220</text>
  <rect x="421" y="334" width="148" height="42" class="module green"/>
  <text x="495" y="353" class="block">PCIe VDDA</text><text x="495" y="368" class="block strong">SC81220</text>
  <rect x="421" y="383" width="148" height="42" class="module green"/>
  <text x="495" y="402" class="block">DDR VDD / VDDQ</text><text x="495" y="417" class="block strong">SC81260</text>
  <rect x="421" y="432" width="148" height="42" class="module green"/>
  <text x="495" y="451" class="block">DDR VPP</text><text x="495" y="466" class="block strong">SC81220</text>

  <path d="M569 110H721M569 159H721M569 208H721M569 257H721M569 306H721M569 355H721M569 404H721M569 453H721" class="wire" marker-end="url(#arrow)"/>
  <text x="584" y="102" class="note">2.5V, 6–8A</text><text x="584" y="151" class="note">12V, 0.5–1A</text><text x="584" y="200" class="note">1.2V, 3A</text>
  <text x="584" y="249" class="note">0.7–0.8V, 10–15A</text><text x="584" y="298" class="note">1.2V, 0.5A</text><text x="584" y="347" class="note">0.8V, 0.8A</text>
  <text x="584" y="396" class="note">1.1V, 5A</text><text x="584" y="445" class="note">1.8V, 1A</text>
  <rect x="721" y="90" width="82" height="139" class="module gray"/><text x="762" y="163" class="block strong">NAND</text>
  <rect x="721" y="237" width="82" height="139" class="module gray"/><text x="762" y="296" class="block strong">eSSD</text><text x="762" y="312" class="block strong">controller</text><text x="762" y="328" class="block strong">+ PCIe PHY</text>
  <rect x="721" y="384" width="82" height="90" class="module gray"/><text x="762" y="433" class="block strong">DDR</text>

  <rect x="87" y="276" width="104" height="42" class="module green"/><text x="139" y="295" class="block">Charger</text><text x="139" y="310" class="block strong">SC8984</text>
  <rect x="87" y="337" width="104" height="38" class="module gray"/><text x="139" y="360" class="block strong">Super Cap</text>
  <path d="M139 318V337" class="wire soft"/><text x="91" y="392" class="label strong">For RAID UPS</text>
  <rect x="54" y="432" width="139" height="42" class="module green"/><text x="124" y="451" class="block">Charge pump converter</text><text x="124" y="466" class="block strong">SC8508 / SC8525</text>
  <rect x="220" y="432" width="104" height="42" class="module amber"/><text x="272" y="457" class="block strong">PMIC / DCDC</text>
  <text x="54" y="497" class="label strong">Two-stage power architecture</text>
</svg>
