<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise SSD LPDDR power rail</title>
  <desc id="desc">Enterprise SSD LPDDR power architecture and two-stage power concept.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#232323"/></marker>
    <style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#202020}.block{font-size:15px;fill:#fff;text-anchor:middle}.label{font-size:14px}.strong{font-weight:700}.logo{fill:#cc241e}.green{fill:#71b044}.amber{fill:#ffbd16}.gray{fill:#aaa}.wire{stroke:#333;stroke-width:1.4;fill:none}.module{rx:8;filter:url(#shadow)}</style>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="52" y="48" width="47" height="4" fill="#c90000"/>
  <text x="905" y="35" text-anchor="end" font-size="18" font-weight="700" class="logo">SOUTHCHIP</text>
  <text x="905" y="51" text-anchor="end" font-size="9" letter-spacing="4">南 芯 科 技</text>
  <text x="117" y="208" class="label">12V</text>
  <path d="M150 216H399" class="wire" marker-end="url(#arrow)"/>
  <rect x="399" y="181" width="165" height="70" class="module green"/>
  <text x="482" y="209" class="block">LPDDR PMIC</text><text x="482" y="232" class="block strong" style="font-size:10px">SC6301 / SC6302 / SC6303</text>
  <path d="M564 216H710" class="wire" marker-end="url(#arrow)"/>
  <text x="592" y="204" class="label">1.1–1.2V, 5–6A</text>
  <rect x="710" y="181" width="118" height="70" class="module gray"/><text x="769" y="222" class="block strong">LPDDR</text>
  <rect x="120" y="330" width="190" height="62" class="module green"/>
  <text x="215" y="356" class="block">Charge pump converter</text><text x="215" y="379" class="block strong">SC8508 / SC8525</text>
  <path d="M310 361H381" class="wire" marker-end="url(#arrow)"/>
  <rect x="381" y="330" width="154" height="62" class="module amber"/><text x="458" y="367" class="block strong">PMIC / DCDC</text>
  <path d="M535 361H622" class="wire" marker-end="url(#arrow)"/>
  <rect x="622" y="330" width="165" height="62" class="module gray"/><text x="705" y="356" class="block">Future two-stage</text><text x="705" y="379" class="block strong">power architecture</text>
  <text x="120" y="424" class="label strong">Two-stage power architecture innovation</text>
</svg>
